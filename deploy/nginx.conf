# Ubuntu Droplet, one public Nginx proxy, backend on loopback.
# Enable HTTPS using Certbot before opening the system to users.
server {
    listen 80;
    server_name qrsystem.com;
    root /var/www/sitepass;
    index index.html;
    client_max_body_size 7m;

    location /api/ {
        # No trailing slash: keep /api in requests sent to Express.
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite client-supplied forwarding headers at this public proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ /\. {
        deny all;
    }
}
